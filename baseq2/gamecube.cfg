// Quake2Cube default GameCube controller preset.
//
// These are ordinary Quake II bindings.
// Players can change them in Options -> Customize Controls.

bind JOY1 "+moveup"       // A: jump
bind JOY2 "+movedown"     // B: crouch
bind JOY3 "weapnext"      // X: next weapon
bind JOY4 "inven"         // Y: inventory

bind AUX1 "invprev"       // L: previous inventory item
bind AUX2 "+attack"       // R: fire
bind AUX3 "invuse"        // Z: use inventory item
